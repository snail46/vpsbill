services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpsbill}
      POSTGRES_USER: ${POSTGRES_USER:-vpsbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpsbill} -d ${POSTGRES_DB:-vpsbill}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Optional mappings preserve settings during upgrades from pre-installer releases.
      APP_NAME: ${APP_NAME:-VPSBill}
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-vpsbill}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpsbill}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_CHECKOUT_URL: ${PAYMENT_CHECKOUT_URL:-}
      PAYMENT_PROVIDER_NAME: ${PAYMENT_PROVIDER_NAME:-generic}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-3s}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-5m}
      LIFECYCLE_INTERVAL: ${LIFECYCLE_INTERVAL:-1m}
      RENEWAL_LEAD_TIME: ${RENEWAL_LEAD_TIME:-168h}
      OVERDUE_GRACE_PERIOD: ${OVERDUE_GRACE_PERIOD:-72h}
      TERMINATION_RETENTION: ${TERMINATION_RETENTION:-168h}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      INTERNAL_URL: ${INTERNAL_URL:-}
    volumes:
      # Local copies of the backups made from the admin console.
      - backups:/var/lib/vpsbill/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Portal and admin console. deploy.sh publishes them on all addresses
      # (direct access) or on loopback behind Caddy, Cloudflare Tunnel or
      # your own proxy, where the trusted listeners 7080/7081 are used.
      - "${PORTAL_BIND:-0.0.0.0}:${PORTAL_PORT:-8080}:${PORTAL_TARGET:-80}"
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_PORT:-8081}:${ADMIN_TARGET:-81}"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

  cloudflared:
    # Cloudflare Tunnel for servers without a public IP. Create a tunnel in
    # the Cloudflare dashboard, point its public hostnames at
    # http://web:7080 (portal) and http://web:7081 (admin), and put the
    # tunnel token in CLOUDFLARE_TUNNEL_TOKEN.
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_started

volumes:
  backups:
  postgres_data:
  caddy_data:
  caddy_config:
