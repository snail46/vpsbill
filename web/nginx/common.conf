# Redirects stay relative so they work behind any published port or proxy.
absolute_redirect off;
# Shared by both surfaces: the API proxy and the single-page app.
root /usr/share/nginx/html;
index index.html;

location /api/ {
    proxy_pass http://api:8080;
    # Ticket attachments: up to 5 images of at most 20 MB each; the API
    # enforces the configured per-image limit.
    client_max_body_size 110m;
    # WebSocket upgrades for consoles and chat.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-VPSBill-Surface $surface;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Hatch agents keep one WebSocket open indefinitely; the API pings every
# 30 seconds, so the proxy timeout only has to exceed that.
location = /api/v1/agent/connect {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-VPSBill-Surface $surface;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
}

location /health/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $client_ip;
}

location = /metrics {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $client_ip;
}

# Hashed bundles never change; the HTML that names them must be
# revalidated so upgrades take effect without a hard refresh.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Browsers ask for it regardless of the icon link; answering here keeps the
# request away from the page below.
location = /favicon.ico {
    return 404;
}

# index.html carries the boot data (site facts and who is signed in) from
# /api/v1/boot through SSI, so a page renders without first waiting for the
# API. It is per visitor, so no shared cache may keep it.
location / {
    ssi on;
    ssi_silent_errors on;
    charset utf-8;
    add_header Cache-Control "private, no-cache";
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/ /index.html;
}
