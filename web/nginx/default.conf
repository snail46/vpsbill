# The customer portal and the admin console are served on separate ports so
# each can sit behind its own domain or reverse proxy rule.
#
#   80   portal, direct from clients        8080  portal, behind a trusted proxy
#   81   admin,  direct from clients        8081  admin,  behind a trusted proxy
#
# Direct listeners take the client address from the TCP peer and replace any
# forwarding headers, so login rate limits cannot be spoofed. The trusted
# listeners are only for Caddy, cloudflared or a proxy on the same host (the
# compose file publishes them on loopback); they take the client address
# from CF-Connecting-IP, X-Real-IP or the first X-Forwarded-For entry.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_for $xff_first {
    "~^\s*(?<first>[^,\s]+)" $first;
    default "";
}

map "$http_cf_connecting_ip|$http_x_real_ip|$xff_first" $proxied_client {
    "~^(?<cf>[^|]+)\|"          $cf;
    "~^\|(?<real>[^|]+)\|"      $real;
    "~^\|\|(?<fwd>.+)$"         $fwd;
    default                     $remote_addr;
}

map $http_x_forwarded_proto $proxied_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    set $surface portal;
    set $client_ip $remote_addr;
    set $client_proto $scheme;
    include /etc/nginx/snippets/portal.conf;
}

server {
    listen 8080;
    server_name _;
    set $surface portal;
    set $client_ip $proxied_client;
    set $client_proto $proxied_proto;
    include /etc/nginx/snippets/portal.conf;
}

server {
    listen 81;
    server_name _;
    set $surface admin;
    set $client_ip $remote_addr;
    set $client_proto $scheme;
    include /etc/nginx/snippets/admin.conf;
}

server {
    listen 8081;
    server_name _;
    set $surface admin;
    set $client_ip $proxied_client;
    set $client_proto $proxied_proto;
    include /etc/nginx/snippets/admin.conf;
}
