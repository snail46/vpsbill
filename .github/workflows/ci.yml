name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vpsbill_test
          POSTGRES_USER: vpsbill
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpsbill -d vpsbill_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://vpsbill:test-password@127.0.0.1:5432/vpsbill_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sh -n deploy.sh backup.sh restore.sh rotate-key.sh smoke-test.sh verify.sh integration-test.sh deploy/install-hatch-agent.sh
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/keyrotate
      - name: Build Hatch agent binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" \
              -o dist/hatch-agent-linux-$arch ./cmd/hatch-agent
          done
          (cd dist && sha256sum hatch-agent-linux-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hatch-agent
          path: dist/
          retention-days: 30
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - name: Validate Docker and Compose runtime
        run: |
          docker version
          docker compose version
          docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env.example -f deploy/docker-compose.yml --profile tls config --quiet
          docker compose --env-file .env.example -f deploy/docker-compose.image.yml config --quiet
          docker compose --env-file .env.example -f deploy/docker-compose.image.yml --profile tls config --quiet
      - name: Build production images
        run: |
          docker build --pull -t vpsbill-api:test .
          docker build --pull -t vpsbill-web:test web
      - name: Verify image security and HTTPS configuration
        run: |
          test "$(docker image inspect vpsbill-api:test --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm \
            -e DOMAIN=billing.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          DOMAIN=billing.example.com PUBLIC_URL=https://billing.example.com APP_PORT=127.0.0.1:8080 \
            docker compose --env-file .env.example -f deploy/docker-compose.image.yml --profile tls config --format json \
            | jq -r '.configs.caddyfile.content' > /tmp/Caddyfile.image
          docker run --rm \
            -e DOMAIN=billing.example.com \
            -v "/tmp/Caddyfile.image:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start and smoke-test the production Compose stack
        run: |
          chmod +x deploy.sh backup.sh restore.sh rotate-key.sh smoke-test.sh
          ./deploy.sh
          ./smoke-test.sh
          INSTALL_RESPONSE="$(curl --fail --silent --show-error -c /tmp/vpsbill-cookies \
            -H 'Content-Type: application/json' \
            --data '{"app_name":"CI Billing","public_url":"http://localhost:8080","timezone":"UTC","payment_provider_name":"generic","payment_checkout_url":"","payment_webhook_secret":"","notification_webhook_url":"","notification_webhook_secret":"","metrics_token":"","worker_poll_interval":"3s","reconcile_interval":"5m","lifecycle_interval":"1m","renewal_lead_time":"168h","overdue_grace_period":"72h","termination_retention":"168h","admin_display_name":"CI Administrator","admin_email":"admin@example.com","admin_password":"integration-password-123"}' \
            http://localhost:8080/api/v1/install)"
          test "$(printf '%s' "$INSTALL_RESPONSE" | jq -r '.data.user.email')" = "admin@example.com"
          METRICS_TOKEN="$(printf '%s' "$INSTALL_RESPONSE" | jq -r '.data.generated_secrets.metrics_token')"
          test "${#METRICS_TOKEN}" -ge 32
          curl --fail --silent --show-error -H "Authorization: Bearer $METRICS_TOKEN" http://localhost:8080/metrics | grep -q vpsbill_accounts
          curl --fail --silent --show-error -b /tmp/vpsbill-cookies http://localhost:8080/api/v1/admin/overview | jq -e '.data.nodes == 0'
          curl --fail --silent --show-error -b /tmp/vpsbill-cookies http://localhost:8080/api/v1/admin/hosts | jq -e '.data | type == "array"'
          curl --fail --silent --show-error -b /tmp/vpsbill-cookies http://localhost:8080/api/v1/admin/settings/payment | jq -e '.data.gateway.type == "disabled"'
          test "$(curl --fail --silent --show-error http://localhost:8080/api/v1/install | jq -r '.data.required')" = "false"
      - name: Exercise backup, restore, and encryption-key rotation
        run: |
          mkdir -p ci-backups
          ./backup.sh ci-backups
          DUMP_FILE="$(find ci-backups -maxdepth 1 -name '*.dump' -type f -print -quit)"
          test -n "$DUMP_FILE"
          test -s "$DUMP_FILE"
          test -s "$DUMP_FILE.sha256"
          ./restore.sh "$DUMP_FILE" --confirm
          ./smoke-test.sh
          OLD_KEY="$(sed -n 's/^ENCRYPTION_KEY=//p' .env)"
          ./rotate-key.sh --confirm
          NEW_KEY="$(sed -n 's/^ENCRYPTION_KEY=//p' .env)"
          test "${#NEW_KEY}" -eq 64
          test "$OLD_KEY" != "$NEW_KEY"
          ./smoke-test.sh
          test "$(curl --fail --silent --show-error http://localhost:8080/api/v1/install | jq -r '.data.required')" = "false"
      - name: Verify final container state
        run: |
          test "$(docker compose --env-file .env -f deploy/docker-compose.yml ps --status running --services | sort | tr '\n' ' ')" = "api postgres web "
          docker compose --env-file .env -f deploy/docker-compose.yml ps
      - name: Print acceptance logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml ps --all || true
            docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color --timestamps || true
          fi
      - name: Tear down acceptance stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml down --volumes --remove-orphans
          fi

  publish-images:
    name: Publish ${{ matrix.image }} image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: ./Dockerfile
          - image: web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
