name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clicd_billing_test
          POSTGRES_USER: clicd
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clicd -d clicd_billing_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://clicd:test-password@127.0.0.1:5432/clicd_billing_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sh -n deploy.sh backup.sh restore.sh rotate-key.sh smoke-test.sh verify.sh integration-test.sh
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/keyrotate
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - name: Validate Docker and Compose runtime
        run: |
          docker version
          docker compose version
          docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env.example -f deploy/docker-compose.yml --profile tls config --quiet
          docker compose --env-file .env.example -f deploy/docker-compose.image.yml config --quiet
          docker compose --env-file .env.example -f deploy/docker-compose.image.yml --profile tls config --quiet
      - name: Build production images
        run: |
          docker build --pull -t clicd-billing-api:test .
          docker build --pull -t clicd-billing-web:test web
      - name: Verify image security and HTTPS configuration
        run: |
          test "$(docker image inspect clicd-billing-api:test --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm \
            -e DOMAIN=billing.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          DOMAIN=billing.example.com PUBLIC_URL=https://billing.example.com APP_PORT=127.0.0.1:8080 \
            docker compose --env-file .env.example -f deploy/docker-compose.image.yml --profile tls config --format json \
            | jq -r '.configs.caddyfile.content' > /tmp/Caddyfile.image
          docker run --rm \
            -e DOMAIN=billing.example.com \
            -v "/tmp/Caddyfile.image:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start and smoke-test the production Compose stack
        run: |
          chmod +x deploy.sh backup.sh restore.sh rotate-key.sh smoke-test.sh
          ./deploy.sh
          ./smoke-test.sh
      - name: Exercise backup, restore, and encryption-key rotation
        run: |
          mkdir -p ci-backups
          ./backup.sh ci-backups
          DUMP_FILE="$(find ci-backups -maxdepth 1 -name '*.dump' -type f -print -quit)"
          test -n "$DUMP_FILE"
          test -s "$DUMP_FILE"
          test -s "$DUMP_FILE.sha256"
          ./restore.sh "$DUMP_FILE" --confirm
          ./smoke-test.sh
          OLD_KEY="$(sed -n 's/^ENCRYPTION_KEY=//p' .env)"
          ./rotate-key.sh --confirm
          NEW_KEY="$(sed -n 's/^ENCRYPTION_KEY=//p' .env)"
          test "${#NEW_KEY}" -eq 64
          test "$OLD_KEY" != "$NEW_KEY"
          ./smoke-test.sh
      - name: Verify final container state
        run: |
          test "$(docker compose --env-file .env -f deploy/docker-compose.yml ps --status running --services | sort | tr '\n' ' ')" = "api postgres web "
          docker compose --env-file .env -f deploy/docker-compose.yml ps
      - name: Print acceptance logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml ps --all || true
            docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color --timestamps || true
          fi
      - name: Tear down acceptance stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml down --volumes --remove-orphans
          fi

  publish-images:
    name: Publish ${{ matrix.image }} image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: ./Dockerfile
          - image: web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
